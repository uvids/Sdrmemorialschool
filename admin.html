<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | SDR Memorial School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- LOGIN BOX -->
  <div id="loginBox" class="min-h-screen flex items-center justify-center p-4 bg-[#091A30]">
    <div class="bg-white max-w-sm w-full rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="text-center">
        <div class="w-12 h-12 rounded-full bg-[#0F2A4A] text-amber-400 flex items-center justify-center font-extrabold mx-auto border-2 border-amber-400">SDR</div>
        <h2 class="text-lg font-extrabold text-[#0F2A4A] mt-2">Clerk Admin Login</h2>
        <p class="text-xs text-slate-500">SDR Memorial Public High School, Basari</p>
      </div>

      <div class="space-y-3">
        <input type="text" id="uInput" placeholder="Username (admin)" class="w-full border rounded-xl px-3.5 py-2.5 text-sm" />
        <input type="password" id="pInput" placeholder="Password (sdr123)" class="w-full border rounded-xl px-3.5 py-2.5 text-sm" />
        <p id="errText" class="hidden text-xs text-rose-600 font-bold">❌ Galat Username ya Password!</p>
        <button type="button" onclick="doAdminLogin()" class="w-full bg-[#0F2A4A] text-white font-bold py-3 rounded-xl shadow">Login Now</button>
      </div>

      <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-xs text-center text-amber-900">
        User: <strong>admin</strong> | Pass: <strong>sdr123</strong>
      </div>
      <div class="text-center"><a href="index.html" class="text-xs text-slate-500 underline">← Back to Website</a></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashBox" class="hidden">
    <header class="bg-[#0F2A4A] text-white p-4 flex justify-between items-center shadow">
      <h1 class="font-bold text-sm sm:text-base">SDR School Admin Dashboard</h1>
      <div class="flex gap-2 text-xs">
        <a href="index.html" class="bg-emerald-600 px-3 py-1.5 rounded-lg font-bold">View Site</a>
        <button type="button" onclick="doLogout()" class="bg-rose-600 px-3 py-1.5 rounded-lg font-bold">Logout</button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">
      <!-- Add Result -->
      <div class="bg-white p-5 rounded-2xl shadow space-y-3">
        <h3 class="font-extrabold text-[#0F2A4A] border-b pb-2">1. Add Student Result</h3>
        <div class="grid sm:grid-cols-3 gap-3 text-sm">
          <input type="text" id="rRoll" placeholder="Roll No (e.g. 105)" class="border rounded-xl p-2" />
          <input type="date" id="rDob" class="border rounded-xl p-2" />
          <input type="text" id="rClass" placeholder="Class (e.g. Class 9th)" class="border rounded-xl p-2" />
          <input type="text" id="rName" placeholder="Student Name" class="border rounded-xl p-2" />
          <input type="text" id="rFather" placeholder="Father Name" class="border rounded-xl p-2" />
          <input type="text" id="rMother" placeholder="Mother Name" class="border rounded-xl p-2" />
        </div>
        <div class="grid grid-cols-5 gap-2 text-xs">
          <input type="number" id="mH" placeholder="Hindi/100" class="border rounded-lg p-2" />
          <input type="number" id="mE" placeholder="Eng/100" class="border rounded-lg p-2" />
          <input type="number" id="mM" placeholder="Math/100" class="border rounded-lg p-2" />
          <input type="number" id="mS" placeholder="Sci/100" class="border rounded-lg p-2" />
          <input type="number" id="mSS" placeholder="SST/100" class="border rounded-lg p-2" />
        </div>
        <button type="button" onclick="saveResult()" class="bg-emerald-600 text-white font-bold text-xs px-5 py-2.5 rounded-xl">Publish Result</button>
        <div id="resList" class="text-xs space-y-1 pt-2"></div>
      </div>
            <!-- Admission Inquiries -->
      <div class="bg-white p-5 rounded-2xl shadow space-y-3">
        <h3 class="font-extrabold text-[#0F2A4A] border-b pb-2">2. Online Admission Forms Received</h3>
        <div id="admList" class="text-xs space-y-2"></div>
      </div>

      <!-- Notice & Counters -->
      <div class="bg-white p-5 rounded-2xl shadow space-y-3">
        <h3 class="font-extrabold text-[#0F2A4A] border-b pb-2">3. Update Notice & School Counters</h3>
        <input type="text" id="nText" class="w-full border rounded-xl p-2 text-sm" />
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-sm">
          <input type="text" id="cAlum" placeholder="Passed Out" class="border rounded-xl p-2" />
          <input type="text" id="cNew" placeholder="New Admissions" class="border rounded-xl p-2" />
          <input type="text" id="cCurr" placeholder="Current Students" class="border rounded-xl p-2" />
          <input type="text" id="cTeach" placeholder="Teachers" class="border rounded-xl p-2" />
        </div>
        <button type="button" onclick="saveSettings()" class="bg-[#0F2A4A] text-white font-bold text-xs px-5 py-2.5 rounded-xl">Save Settings</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
  <script>
    function doAdminLogin() {
      const u = document.getElementById("uInput").value.trim().toLowerCase();
      const p = document.getElementById("pInput").value.trim();
      if (u === "admin" && p === "sdr123") {
        sessionStorage.setItem("sdr_ok", "1");
        showDash();
      } else {
        document.getElementById("errText").classList.remove("hidden");
      }
    }

    function doLogout() {
      sessionStorage.removeItem("sdr_ok");
      location.reload();
    }

    function showDash() {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("dashBox").classList.remove("hidden");
      loadDashData();
    }

    if (sessionStorage.getItem("sdr_ok") === "1") showDash();

    function loadDashData() {
      document.getElementById("nText").value = schoolData.notice;
      document.getElementById("cAlum").value = schoolData.stats.alumni;
      document.getElementById("cNew").value = schoolData.stats.newAdmissions;
      document.getElementById("cCurr").value = schoolData.stats.currentStudents;
      document.getElementById("cTeach").value = schoolData.stats.teachers;

      document.getElementById("resList").innerHTML = schoolData.results.map((r, i) =>
        `<div class="p-2 bg-slate-50 border rounded flex justify-between"><span><strong>Roll ${r.roll}:</strong> ${r.name} (${r.className})</span><button onclick="delRes(${i})" class="text-rose-600 font-bold">Delete</button></div>`
      ).join("");

      const adms = JSON.parse(localStorage.getItem("sdr_admission_inquiries") || "[]");
      document.getElementById("admList").innerHTML = adms.length ? adms.map(a =>
        `<div class="p-2.5 bg-emerald-50 border border-emerald-200 rounded"><strong>${a.appId}</strong> • ${a.name} (${a.className}) • Father: ${a.father} • Mob: <strong>${a.mobile}</strong></div>`
      ).join("") : "<p class='text-slate-500'>No admissions yet.</p>";
    }

    function saveResult() {
      const split = (v) => ({ theory: Math.round(v * 0.8), practical: v - Math.round(v * 0.8) });
      schoolData.results.unshift({
        roll: document.getElementById("rRoll").value.trim(),
        dob: document.getElementById("rDob").value,
        name: document.getElementById("rName").value.trim(),
        fatherName: document.getElementById("rFather").value.trim(),
        motherName: document.getElementById("rMother").value.trim(),
        className: document.getElementById("rClass").value.trim(),
        examTitle: "ANNUAL PROGRESS REPORT 2026–27",
        attendance: "95%",
        subjects: [
          { name: "Hindi", max: 100, ...split(Number(document.getElementById("mH").value)) },
          { name: "English", max: 100, ...split(Number(document.getElementById("mE").value)) },
          { name: "Mathematics", max: 100, ...split(Number(document.getElementById("mM").value)) },
          { name: "Science", max: 100, ...split(Number(document.getElementById("mS").value)) },
          { name: "Social Science", max: 100, ...split(Number(document.getElementById("mSS").value)) }
        ]
      });
      localStorage.setItem("sdr_school_portal_data", JSON.stringify(schoolData));
      loadDashData();
      alert("✅ Result Published!");
    }

    function delRes(i) {
      schoolData.results.splice(i, 1);
      localStorage.setItem("sdr_school_portal_data", JSON.stringify(schoolData));
      loadDashData();
    }

    function saveSettings() {
      schoolData.notice = document.getElementById("nText").value;
      schoolData.stats.alumni = document.getElementById("cAlum").value;
      schoolData.stats.newAdmissions = document.getElementById("cNew").value;
      schoolData.stats.currentStudents = document.getElementById("cCurr").value;
      schoolData.stats.teachers = document.getElementById("cTeach").value;
      localStorage.setItem("sdr_school_portal_data", JSON.stringify(schoolData));
      alert("✅ Settings Updated!");
    }
  </script>
</body>
</html>
